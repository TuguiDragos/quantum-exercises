version: 2

# Actions are SHA-pinned, so only these pull requests move them. They also keep
# the repository active: GitHub disables scheduled workflows after 60 days idle.

updates:
  # If Dependabot ever rejects the cron interval, fall back to `interval: "monthly"`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "23 6 1,15 * *"
      timezone: "Etc/UTC"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Expect these to fail until the README badges and CONTRIBUTING table are
  # updated to the new versions; the failing tests list what to change.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "23 6 1,15 * *"
      timezone: "Etc/UTC"
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "cron"
      cronjob: "23 6 1,15 * *"
      timezone: "Etc/UTC"
    groups:
      website:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
