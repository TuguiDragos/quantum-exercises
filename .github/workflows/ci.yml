name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never submit a job to a real QPU, whatever credentials exist.
  QX_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # pre-commit is opt-in, so scan here too. `gitleaks git --staged` would see
  # nothing on a fresh checkout; `gitleaks dir` scans the tree.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan for hardcoded secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -q

  # coverage is pulled in with --with so it stays out of pyproject.toml and uv.lock.
  # Threshold and settings live in [tool.coverage].
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --with coverage python -m coverage run -m pytest -q
      # parallel mode writes one data file per process.
      - run: uv run --with coverage python -m coverage combine
      - run: uv run --with coverage python -m coverage report

  # The README's install path; also proves qx finds the exercises from any directory.
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the way the README says
        run: |
          set -euo pipefail
          uv tool install --editable .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Run it from outside the repository
        run: |
          set -euo pipefail
          cd "$HOME"
          qx version
          qx doctor
          qx list

  # Installs the built wheel with no repository around and runs a learner to a
  # passing exercise, proving the wheel carries the course.
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install it into an environment of its own
        run: |
          set -euo pipefail
          uv venv "$HOME/wheel-env" --python 3.13
          VIRTUAL_ENV="$HOME/wheel-env" uv pip install dist/*.whl
      # Shared with verify.yml, which runs it on macOS and Windows.
      - name: Take a learner through it, with no repository in sight
        run: bash .github/scripts/wheel-smoke.sh "$HOME/wheel-env" "$HOME/elsewhere"
