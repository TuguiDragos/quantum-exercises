name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let CI submit a job to a real QPU, whatever credentials exist.
  QX_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # pre-commit is opt-in per clone, so the secret scan has to run here too.
  # The pre-commit hook runs `gitleaks git --staged`, which only sees what is
  # about to be committed; on a fresh CI checkout nothing is staged, so it would
  # scan nothing at all. `gitleaks dir` scans the tree, which is what is wanted.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan for hardcoded secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -q

  # The suite covers every line of src/, and only a gate keeps it that way.
  # coverage is pulled in for these commands alone, so it never reaches
  # pyproject.toml, uv.lock, or the package counts CONTRIBUTING documents.
  # The threshold and the subprocess setting live in [tool.coverage] there.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --with coverage python -m coverage run -m pytest -q
      # parallel mode writes one file per process, including every worker.
      - run: uv run --with coverage python -m coverage combine
      - run: uv run --with coverage python -m coverage report

  # The README tells a learner to install with `uv tool install --editable .`, and
  # nothing else here runs that path. It is also what proves the claim that qx
  # finds the exercises from any directory.
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the way the README says
        run: |
          set -euo pipefail
          uv tool install --editable .
          # Asked for rather than assumed: the location is uv's to decide.
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Run it from outside the repository
        run: |
          set -euo pipefail
          cd "$HOME"
          qx version
          qx doctor
          qx list
