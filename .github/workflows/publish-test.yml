name: publish-test

# Rehearses publish.yml against TestPyPI. An index accepts a version only once,
# so this checks the upload before a real version number is spent.
#
# Trusted publisher on test.pypi.org: owner `TuguiDragos`, repository
# `quantum-exercises`, workflow `publish-test.yml`, environment `testpypi`.
#
# qiskit is not on TestPyPI, so installing the result needs PyPI too:
#
#   uv pip install quantum-exercises \
#     --index-url https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ \
#     --index-strategy unsafe-best-match

on:
  workflow_dispatch:

permissions: {}

jobs:
  # No cache, to match publish.yml exactly.
  publish-test:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Build the wheel and the sdist
        run: uv build

      # Keep identical to publish.yml.
      - name: Refuse to publish a wheel with no course in it
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, zipfile, pathlib
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          exercises = {n.split("/")[3] for n in names if "/_course/exercises/" in n}
          if len(exercises) < 20:
              sys.exit(f"{wheel.name} carries {len(exercises)} exercises, expected 20")
          if not any("/_course/notebooks/" in n for n in names):
              sys.exit(f"{wheel.name} carries no notebooks")
          print(f"{wheel.name}: {len(exercises)} exercises and the notebooks are in")
          PY

      # Same action as publish.yml; TestPyPI shows the attestations as PyPI would.
      - name: Upload to TestPyPI, with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          repository-url: https://test.pypi.org/legacy/
