name: publish

# Trusted publishing, no token: PyPI trusts this workflow and the job gets a
# short-lived identity via `id-token: write`. Publisher on pypi.org: owner
# `TuguiDragos`, repository `quantum-exercises`, workflow `publish.yml`,
# environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  QX_OFFLINE: "1"

# No cache on purpose: a cache filled by less privileged runs must not be
# restored into the job that holds `id-token: write`. setup-uv already disables
# it on `release`; do not add `enable-cache: true`.

jobs:
  # An index accepts a version only once, so lint and tests pass before upload.
  # Also checks the ref is a tag (not a branch) named after the package version.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - name: The ref has to be a tag that names the version being published
        run: |
          set -euo pipefail
          version="$(uv run python -c 'import quantum_exercises; print(quantum_exercises.__version__)')"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "ref $GITHUB_REF_NAME is a $GITHUB_REF_TYPE, and version is $version"
            echo "release from the tag, and only after the version bump is committed"
            exit 1
          fi
          echo "publishing $version from tag $GITHUB_REF_NAME"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Build the wheel and the sdist
        run: uv build

      # A wheel without the course installs fine but leaves `qx init` nothing to copy.
      - name: Refuse to publish a wheel with no course in it
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, zipfile, pathlib
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          exercises = {n.split("/")[3] for n in names if "/_course/exercises/" in n}
          if len(exercises) < 20:
              sys.exit(f"{wheel.name} carries {len(exercises)} exercises, expected 20")
          if not any("/_course/notebooks/" in n for n in names):
              sys.exit(f"{wheel.name} carries no notebooks")
          print(f"{wheel.name}: {len(exercises)} exercises and the notebooks are in")
          PY

      # Not `uv publish`: it only uploads existing attestations, never creates them.
      # This action signs the distributions and sends PEP 740 attestations.
      - name: Upload to PyPI, with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
