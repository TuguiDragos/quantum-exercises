name: publish

# Uploads the distributions to PyPI when a release is published.
#
# No token lives anywhere. PyPI is told, once, to trust releases coming from this
# workflow in this repository, and the job asks GitHub for a short lived identity
# at run time. That is why the job needs `id-token: write` and nothing else, and
# why nobody has to rotate a secret.
#
# Setting it up on the PyPI side is a one time thing, under the project's
# Publishing settings: owner `TuguiDragos`, repository `quantum-exercises`,
# workflow `publish.yml`, environment `pypi`. Until that exists the job fails at
# the upload step and changes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  QX_OFFLINE: "1"

# Neither job below caches. setup-uv v10 turns its cache off by default for
# `release`, `pull_request_target` and `workflow_run`, because a job triggered
# that way runs with more privilege than whatever filled the cache, and this one
# holds `id-token: write` and uploads to PyPI. Setting `enable-cache: true` here
# would have opted straight back into that, so it is simply gone: it ran once per
# release and saved seconds, against a restore path into the most privileged job
# in the repository. ci.yml and verify.yml keep theirs, since neither runs on
# those events and both run often enough for it to matter.

jobs:
  # An index accepts a version once, so the upload has to be the last thing that
  # happens rather than the first. 0.8.1 went to PyPI four minutes before the CI
  # run on the same commit finished, which means it was published before anything
  # had confirmed the commit was good. This job is that confirmation, and the
  # upload below waits for it.
  #
  # It also settles the other question nothing asked: that the tag being released
  # is the version the build will carry. The ref type is checked as well as the
  # name, because the name alone only held while nobody named a branch after a
  # version. A branch called 0.8.4 would have satisfied it on workflow_dispatch,
  # which made a comment claiming tags-only into a naming convention.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - name: The ref has to be a tag that names the version being published
        run: |
          set -euo pipefail
          version="$(uv run python -c 'import quantum_exercises; print(quantum_exercises.__version__)')"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "ref $GITHUB_REF_NAME is a $GITHUB_REF_TYPE, and version is $version"
            echo "release from the tag, and only after the version bump is committed"
            exit 1
          fi
          echo "publishing $version from tag $GITHUB_REF_NAME"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  publish:
    needs: gate
    runs-on: ubuntu-latest
    # A named environment, so the upload can be held behind a review rule if that
    # is ever wanted. It costs nothing while no rule is set.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel and the sdist
        run: uv build

      # A wheel without the course installs cleanly and then has nothing to give
      # `qx init`, which is the one packaging mistake that would reach a reader
      # rather than a maintainer. Cheaper to check here than to yank a release.
      - name: Refuse to publish a wheel with no course in it
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, zipfile, pathlib
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          exercises = {n.split("/")[3] for n in names if "/_course/exercises/" in n}
          if len(exercises) < 20:
              sys.exit(f"{wheel.name} carries {len(exercises)} exercises, expected 20")
          if not any("/_course/notebooks/" in n for n in names):
              sys.exit(f"{wheel.name} carries no notebooks")
          print(f"{wheel.name}: {len(exercises)} exercises and the notebooks are in")
          PY

      # Not `uv publish`, and the reason is narrow: it uploads attestations that
      # are already sitting beside the files, and does not make any. Nothing in
      # this workflow made them, so every release so far went up unattested while
      # the upload reported success. Trusted publishing was never the gap; it says
      # who uploaded, not what was uploaded. This action signs the distributions
      # with the same short lived identity and sends the PEP 740 attestations with
      # them, which is what puts a provenance file on the project page.
      - name: Upload to PyPI, with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
