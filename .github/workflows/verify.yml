name: verify

# Does the curriculum still work against today's Qiskit? "latest" ignores
# uv.lock on purpose. The costly locked OS matrix runs only on the 1st.
#
# Two cron entries rather than "1,15": github.event.schedule reports the cron
# string, so the jobs need distinct strings to tell the days apart.

on:
  schedule:
    - cron: "23 6 1 * *" # the 1st: everything, including the full OS matrix
    - cron: "23 6 15 * *" # the 15th: the fresh resolution and the next-major probe
  workflow_dispatch:

permissions: {}

env:
  QX_OFFLINE: "1"

  # Tests that only hold for the locked versions (badges, version table, lock
  # counts). By node id, so renaming one of them silently stops deselecting it.
  # Passed via PYTEST_ADDOPTS so pytest splits it, not the shell.
  UNPINNED_DESELECT: >-
    --deselect tests/test_packaging.py::TestReadmeBadges::test_version_badges_match_the_installed_version
    --deselect tests/test_packaging.py::TestDependencyInventory::test_documented_versions_are_the_installed_ones
    --deselect tests/test_packaging.py::TestDependencyInventory::test_locked_package_counts_are_accurate

jobs:
  # != rather than ==, so workflow_dispatch (empty schedule) runs it too.
  locked:
    if: github.event.schedule != '23 6 15 * *'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -q

  # ci.yml runs the wheel smoke test on Linux only; this covers macOS and Windows.
  wheel:
    if: github.event.schedule != '23 6 15 * *'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Git Bash on Windows; the shared script is bash-only.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv build --wheel --out-dir dist
      - name: Install it into an environment of its own
        run: |
          set -euo pipefail
          uv venv "$HOME/wheel-env" --python 3.13
          VIRTUAL_ENV="$HOME/wheel-env" uv pip install dist/*.whl
      - name: Take a learner through it, with no repository in sight
        run: bash .github/scripts/wheel-smoke.sh "$HOME/wheel-env" "$HOME/elsewhere"

  # Early warning: newest versions the dependency ranges allow.
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Resolve to the newest allowed versions
        run: uv sync --upgrade --all-extras --dev
      - run: uv run pytest -q
        env:
          PYTEST_ADDOPTS: ${{ env.UNPINNED_DESELECT }}
      # Runs even after a failure, and tolerates qiskit not importing.
      # --no-sync reports the environment pytest ran against, without re-resolving.
      - name: Record what was tested
        if: always()
        run: |
          set -uo pipefail
          version="$(uv run --no-sync python -c 'import qiskit; print(qiskit.__version__)' 2>/dev/null)" \
            || version=""
          if [ -n "$version" ]; then
            echo "Verified against qiskit **$version** on $(date -u +%Y-%m-%d)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No qiskit version was recorded: the environment never resolved." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # Installs the next major over the <3 ceiling, which `latest` never resolves.
  # continue-on-error: the badge reports on the shipped ranges only.
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      # An unreachable index must fail, not pass as "no release yet". "unsatisfiable"
      # is uv's wording (checked on uv 0.11.26); if it changes, this fails loudly.
      - name: Install the next major over the ceiling, if one exists yet
        id: major
        run: |
          set -uo pipefail
          log="$(mktemp)"
          if uv pip install --upgrade --prerelease=allow 'qiskit[visualization]>=3.0.0.dev0' \
              >"$log" 2>&1; then
            echo "found=1" >> "$GITHUB_OUTPUT"
          elif grep -q "unsatisfiable" "$log"; then
            echo "No qiskit 3.x on PyPI yet, nothing to preview." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The index could not be reached, so this run says nothing about qiskit 3." \
              >> "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit 1
          fi
      # --no-sync, or `uv run` restores the locked qiskit 2.x.
      - name: Run the suite against it
        if: steps.major.outputs.found == '1'
        run: uv run --no-sync pytest -q
        env:
          PYTEST_ADDOPTS: ${{ env.UNPINNED_DESELECT }}
      - name: Record what was previewed
        if: steps.major.outputs.found == '1'
        run: |
          set -euo pipefail
          version="$(uv run --no-sync python -c 'import qiskit; print(qiskit.__version__)')"
          echo "Previewed qiskit **$version**, which pyproject.toml does not allow yet." \
            >> "$GITHUB_STEP_SUMMARY"
