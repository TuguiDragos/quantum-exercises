name: weekly-verify

# The point of this workflow is not to test the code, ci.yml does that. It is to
# answer one question every week: does this curriculum still work against the
# Qiskit that exists today?
#
# That is why the "latest" job deliberately ignores uv.lock. If a new Qiskit
# release breaks a reference solution, this is what notices.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions: {}

env:
  QX_OFFLINE: "1"

jobs:
  # Reproducible run: the exact versions recorded in uv.lock.
  locked:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -q

  # Early warning: newest versions the dependency ranges allow.
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Resolve to the newest allowed versions
        run: uv sync --upgrade --all-extras --dev
      - run: uv run pytest -q
      - name: Record what was tested
        if: always()
        run: |
          set -euo pipefail
          version="$(uv run python -c 'import qiskit; print(qiskit.__version__)')"
          # Goes on the run summary page rather than into a badge, so nothing has
          # to be written back to the repository and no workflow needs write access.
          echo "Verified against qiskit **$version** on $(date -u +%Y-%m-%d)." \
            >> "$GITHUB_STEP_SUMMARY"
