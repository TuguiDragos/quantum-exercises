title = "quantum-exercises"

[extend]
useDefault = true

# IBM Quantum keys are 44 generic characters, so match only when assigned to a
# token-like name. The optional backslash before quotes catches .ipynb JSON.
[[rules]]
id = "ibm-quantum-api-key"
description = "IBM Quantum API key assigned to a token-like name"
regex = '''(?i)(?:qiskit_ibm_token|api[_-]?key|apikey|\btoken\b)\s*[:=]\s*\\?["']([A-Za-z0-9_\-]{40,50})\\?["']'''
secretGroup = 1
keywords = ["token", "api_key", "apikey", "api-key"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  # Documentation placeholders.
  '''(?i)\\?["'](?:your|my|the)[_-]?(?:api[_-]?)?key''',
  '''(?i)\\?["']<[^"']*>\\?["']''',
  '''(?i)\\?["']x{40,50}\\?["']''',
  '''(?i)\\?["']a{40,50}\\?["']''',
]
