[project]
name = "quantum-exercises"
version = "0.8.5"
description = "Hands-on quantum computing exercises for Qiskit, from an empty laptop to real IBM hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tugui Dragos" }]
keywords = ["quantum", "qiskit", "exercises", "education", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]

# Ranges, not exact pins: the scheduled verify job must be able to see a new
# Qiskit break us.
# uv.lock is committed, so day-to-day installs stay byte-reproducible anyway.
dependencies = [
    "qiskit[visualization]>=2.5,<3",
    "qiskit-ibm-runtime>=0.48,<1",
    "qiskit-aer>=0.17,<1",
    "typer>=0.27,<1",
    "rich>=15,<16",
    "watchfiles>=1.2,<2",
    # Imported directly by checks.py, so declared rather than leaned on via qiskit.
    "numpy>=2.0,<3",
    "scipy>=1.14",
    # tomllib landed in 3.11; this keeps the 3.10 floor honest.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/TuguiDragos/quantum-exercises"
Issues = "https://github.com/TuguiDragos/quantum-exercises/issues"
Blog = "https://tuguidragos.com"

[project.scripts]
qx = "quantum_exercises.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ipykernel>=7,<8",
    "nbstripout>=0.9,<1",
    "pre-commit>=4,<5",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_exercises"]
# Bytecode left by an in-process import of a check.py, and notebook checkpoints.
# Both are ignored by git and neither belongs in a release, so they are named
# here rather than left to whatever happens to be on the machine that builds.
exclude = ["**/__pycache__", "**/*.pyc", "**/.ipynb_checkpoints"]

# The course travels with the tool, so `pip install` hands a learner something to
# run. It sits under the package rather than beside it, and that is what keeps it
# out of find_project_root's way: the walk looks for `exercises/` in each ancestor
# of the working directory, and never sees one nested this deep inside the
# package. `qx init` copies it somewhere writable, which is the only kind of place
# a course is ever edited. readme-assets stays out: 7 MB of screenshots that a
# learner never opens.
[tool.hatch.build.targets.wheel.force-include]
"exercises" = "quantum_exercises/_course/exercises"
"notebooks" = "quantum_exercises/_course/notebooks"

# The sdist carries the repository, which is what it is for, minus the one part
# nothing needs from it: the screenshots are 7 MB of the archive, no build step
# reads them, and the README that PyPI renders loads them over https rather than
# out of the file. Excluded here and not in the wheel section, because a wheel
# never had them.
[tool.hatch.build.targets.sdist]
exclude = ["readme-assets", "**/__pycache__", "**/*.pyc", "**/.ipynb_checkpoints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The -m is what makes "deselected by default" true. Without it the marker was a
# label and nothing else, so the first test to carry one would have run in CI and
# spent someone's QPU quota. Opt in with `uv run pytest -m hardware`.
addopts = "-q --strict-markers -m 'not hardware'"
markers = [
    "hardware: needs a real IBM Quantum account and consumes QPU quota (deselected by default)",
]

# coverage is deliberately not a dependency. CI adds it for one command with
# `uv run --with`, so uv.lock and the package counts in CONTRIBUTING stay as they
# are. Settings still live here, because that is where coverage looks.
[tool.coverage.run]
source = ["quantum_exercises"]
# Every answer is checked in a worker subprocess, and worker.py runs nowhere else,
# so without this it would measure as untouched. Needs coverage 7.10 or newer.
patch = ["subprocess"]
parallel = true
# Branches as well as lines. A line count cannot see an `if` whose false arm is
# never taken, which is where a guard quietly stops guarding. Declared here
# rather than as a flag on the CI command, so the command CONTRIBUTING gives a
# reader to run locally measures exactly what the gate measures.
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
# The suite reaches every line today. Anything less is a line nothing exercises.
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Exercise files are deliberately incomplete: unused imports and bare TODOs are
# the point. template.py must carry the same ignores, or `ruff check --fix` strips
# the imports a learner is meant to be handed by `qx reset`.
[tool.ruff.lint.per-file-ignores]
"exercises/*/exercise.py" = ["F401", "F821", "E501"]
"exercises/*/template.py" = ["F401", "F821", "E501"]
