[project]
name = "quantum-exercises"
version = "1.0.0"
description = "Hands-on quantum computing exercises for Qiskit, from an empty laptop to real IBM hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tugui Dragos" }]
keywords = ["quantum", "qiskit", "exercises", "education", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]

# Ranges, not pins, so verify.yml can see a new Qiskit break the course.
# uv.lock keeps everyday installs reproducible.
dependencies = [
    "qiskit[visualization]>=2.5,<3",
    "qiskit-ibm-runtime>=0.50,<1",
    "qiskit-aer>=0.17,<1",
    "typer>=0.27,<1",
    "rich>=15,<16",
    "watchfiles>=1.2,<2",
    # Imported directly by checks.py.
    "numpy>=2.0,<3",
    "scipy>=1.14",
    # tomllib is 3.11+.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://quantum-exercises.tuguidragos.com/"
Source = "https://github.com/TuguiDragos/quantum-exercises"
Issues = "https://github.com/TuguiDragos/quantum-exercises/issues"
Blog = "https://tuguidragos.com"

[project.scripts]
qx = "quantum_exercises.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ipykernel>=7,<8",
    "nbstripout>=0.9,<1",
    "pre-commit>=4,<5",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_exercises"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.ipynb_checkpoints"]

# The course ships inside the package for `qx init` to copy. Nested this deep,
# find_project_root never mistakes it for a course to edit.
[tool.hatch.build.targets.wheel.force-include]
"exercises" = "quantum_exercises/_course/exercises"
"notebooks" = "quantum_exercises/_course/notebooks"

# readme-assets (7 MB of screenshots) and website/ are not needed by any build.
[tool.hatch.build.targets.sdist]
exclude = ["readme-assets", "website", "**/__pycache__", "**/*.pyc", "**/.ipynb_checkpoints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m keeps hardware tests (real QPU quota) out by default; opt in with -m hardware.
addopts = "-q --strict-markers -m 'not hardware'"
markers = [
    "hardware: needs a real IBM Quantum account and consumes QPU quota (deselected by default)",
]

# coverage is not a dependency; CI adds it with `uv run --with`.
[tool.coverage.run]
source = ["quantum_exercises"]
# Answers are checked in a worker subprocess; without this worker.py measures as
# untouched. Needs coverage 7.10+.
patch = ["subprocess"]
parallel = true
# Here rather than a CI flag, so local runs measure what the gate measures.
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Exercise files are deliberately incomplete. template.py needs the same ignores,
# or `ruff check --fix` strips the imports `qx reset` hands a learner.
[tool.ruff.lint.per-file-ignores]
"exercises/*/exercise.py" = ["F401", "F821", "E501"]
"exercises/*/template.py" = ["F401", "F821", "E501"]
