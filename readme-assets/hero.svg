  <text x="100" y="222">  <tspan fill="#cfd3e5">00</tspan>  <tspan fill="#9184d9">██████████████████</tspan>    <tspan fill="#cfd3e5">972</tspan>  <tspan fill="#cfd3e5">47.5%</tspan></text>
